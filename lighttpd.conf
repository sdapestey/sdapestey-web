# lighttpd solo — reemplaza nginx
#
# Arranque (puerto 80/443 → root):
#   sudo lighttpd -D -f /home/sdapestey/sdapestey-web/lighttpd.conf

var.base = "/home/sdapestey/sdapestey-web"
var.cert = "/etc/letsencrypt/live/sdapestey.com.ar"

server.modules = (
  "mod_access",
  "mod_alias",
  "mod_redirect",
  "mod_setenv",
  "mod_expire",
  "mod_openssl"
)

server.document-root = var.base + "/web"
server.bind          = "0.0.0.0"
server.port          = 80
server.pid-file      = "/run/lighttpd-sdapestey.pid"
server.errorlog      = "/var/log/lighttpd-sdapestey-error.log"
server.username      = "www-data"
server.groupname     = "www-data"

index-file.names = ("index.html")

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "text/javascript; charset=utf-8",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".png"  => "image/png",
  ".ico"  => "image/x-icon",
  ".svg"  => "image/svg+xml",
  ".pdf"  => "application/pdf",
  ".webp" => "image/webp",
  ".woff2"=> "font/woff2",
  ""      => "application/octet-stream"
)

url.access-deny = ("~", ".inc", ".git")
static-file.exclude-extensions = (".php", ".pl", ".fcgi", ".scgi")

$HTTP["url"] =~ "\.(jpg|jpeg|png|ico|webp|woff2)$" {
  expire.url = ("" => "access plus 7 days")
}

$HTTP["url"] =~ "\.(css|js)$" {
  expire.url = ("" => "access plus 1 hours")
}

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options" => "SAMEORIGIN",
  "Referrer-Policy" => "strict-origin-when-cross-origin"
)

# HTTP → HTTPS
$HTTP["scheme"] == "http" {
  url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
  url.redirect-code = 301
}

# HTTPS
$SERVER["socket"] == ":443" {
  ssl.engine  = "enable"
  ssl.pemfile = var.cert + "/fullchain.pem"
  ssl.privkey = var.cert + "/privkey.pem"
}
