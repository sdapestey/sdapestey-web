# lighttpd — backend estático detrás de nginx (TLS en 443)
#
# Arquitectura:
#   Internet → nginx :80/:443 → lighttpd 127.0.0.1:8080
#
# Arranque:
#   lighttpd -D -f lighttpd.conf
#   (sin sudo: puerto 8080 en localhost)

var.base = "/home/sdapestey/sdapestey-web"

server.modules = (
  "mod_access",
  "mod_alias",
  "mod_setenv",
  "mod_expire"
)

server.document-root = var.base + "/web"
server.bind          = "127.0.0.1"
server.port          = 8080
server.pid-file      = "/tmp/sdapestey-web.pid"
server.errorlog      = "/tmp/sdapestey-web-error.log"

index-file.names = ("index.html")

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "text/javascript; charset=utf-8",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".png"  => "image/png",
  ".ico"  => "image/x-icon",
  ".svg"  => "image/svg+xml",
  ".pdf"  => "application/pdf",
  ".webp" => "image/webp",
  ".woff2"=> "font/woff2",
  ""      => "application/octet-stream"
)

url.access-deny = ("~", ".inc", ".git")
static-file.exclude-extensions = (".php", ".pl", ".fcgi", ".scgi")

$HTTP["url"] =~ "\.(css|js|jpg|jpeg|png|ico|webp|woff2)$" {
  expire.url = ("" => "access plus 7 days")
}

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options" => "SAMEORIGIN",
  "Referrer-Policy" => "strict-origin-when-cross-origin"
)
